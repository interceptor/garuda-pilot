<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}garuda-pilot{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>

<nav>
<div class="nav-inner">
    <span class="brand">garuda-pilot</span>
    <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/preview" class="nav-link {% if active_page == 'preview' %}active{% endif %}">Preview</a>
    <a href="/history" class="nav-link {% if active_page == 'history' %}active{% endif %}">History</a>
    <a href="/news" class="nav-link {% if active_page == 'news' %}active{% endif %}">News</a>
    <a href="/security" class="nav-link {% if active_page == 'security' %}active{% endif %}">Security</a>
    <a href="/health" class="nav-link {% if active_page == 'health' %}active{% endif %}">Health</a>
    <a href="/snapshots" class="nav-link {% if active_page == 'snapshots' %}active{% endif %}">Snapshots</a>
    <a href="/pacnew" class="nav-link {% if active_page == 'pacnew' %}active{% endif %}">Pacnew</a>
    <span style="flex: 1;"></span>
    <a href="/changelog" class="nav-link {% if active_page == 'changelog' %}active{% endif %}">Changelog</a>
    <a href="/about" class="nav-link {% if active_page == 'about' %}active{% endif %}">About</a>
</div>
</nav>

<div class="container">
{% block content %}{% endblock %}
</div>

</body>
</html>
