[project]
name = "garuda-pilot"
version = "0.5.5"
description = "Upgrade management dashboard for Garuda Linux and Arch-based distros"
authors = [
    {name = "Mike"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["garuda", "arch", "linux", "pacman", "upgrade", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "jinja2>=3.1,<4",
    "aiosqlite>=0.20,<0.21",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.9,<0.1",
]

[project.urls]
Homepage = "https://github.com/interceptor/garuda-pilot"
Repository = "https://github.com/interceptor/garuda-pilot"

[project.scripts]
garuda-pilot = "garuda_pilot.__main__:main"

[tool.poetry]
packages = [{include = "garuda_pilot"}]

[tool.poetry.scripts]
garuda-pilot = "garuda_pilot.__main__:main"

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
jinja2 = "^3.1"
aiosqlite = "^0.20"
httpx = "^0.28"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
