[project]
name = "garuda-pilot"
version = "0.1.0"
description = "Upgrade management dashboard for Garuda Linux"
authors = [
    {name = "Mike"}
]
requires-python = ">=3.11"

[tool.poetry]
packages = [{include = "garuda_pilot"}]

[tool.poetry.scripts]
garuda-pilot = "garuda_pilot.__main__:main"

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
jinja2 = "^3.1"
aiosqlite = "^0.20"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
